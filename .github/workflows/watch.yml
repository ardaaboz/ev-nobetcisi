name: ev-nobetcisi

# Neden bu tuhaf yapi:
#
# GitHub ucretsiz repolarda `schedule` tetikleyicisini duzenli calistirmiyor.
# Olculdu (2026-08-22): */5 cron ile 70 dakikada SADECE 1 kosu tetiklendi,
# ayni surede elle atilan workflow_dispatch'lerin hepsi aninda calisti.
# Yani zamanlayiciya guvenip "5 dakikada bir kos" demek ise yaramiyor.
#
# Cozum: zamanlayiciya sadece ISI BASLATMA gorevi veriliyor. Is bir kez
# basladiginda ~5,5 saat boyunca kendi icinde dongu kurup 5 dakikada bir
# tariyor. Sik zamanlanmis denemelerden birinin tutmasi yeterli; zaten
# calisan bir is varsa yeni gelen saniyeler icinde cikiyor.
#
# Public repoda GitHub-hosted runner dakikalari ucretsiz ve sinirsiz oldugu
# icin uzun suren is bir maliyet yaratmiyor. Private repoda bu yapi
# calismaz - aylik kotayi tek gunde bitirir.

on:
  schedule:
    # Sadece yeniden baslatici, sik deneniyor. Calisan bir is varken gelen
    # denemeler 6 saniyede cikiyor, public repoda maliyeti yok. Sik denemenin
    # amaci devir teslim boslugunu kisaltmak: bir is bittiginde yerine yenisi
    # ne kadar cabuk baslarsa o kadar iyi, GitHub denemelerin cogunu dusuruyor.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Zaten calisan bir kosu var mi
        id: nobet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Kisa bekleme: bir onceki is kendi yerine bunu baslatip hemen
          # cikiyor. Beklemeden bakarsak onu hala "calisiyor" gorup gereksiz
          # yere kendimizi iptal ederiz.
          sleep 30

          # Ayni workflow'un devam eden baska bir kosusu varsa ve o benden
          # once basladiysa (daha kucuk id), bu kosu gereksiz - cik.
          ONCEKI=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/runs?status=in_progress&per_page=100" \
            --jq "[.workflow_runs[] | select(.id < ${GITHUB_RUN_ID})] | length")
          echo "devam eden onceki kosu: $ONCEKI"
          if [ "$ONCEKI" -gt 0 ]; then
            echo "devam=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "devam=evet" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.nobet.outputs.devam == 'evet'
        with:
          python-version: "3.11"
          cache: pip

      - name: Bagimliliklari kur
        if: steps.nobet.outputs.devam == 'evet'
        run: pip install -e .

      - name: Nobet dongusu
        if: steps.nobet.outputs.devam == 'evet'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_GENDER: ${{ vars.USER_GENDER || 'f' }}
        run: |
          git config user.name "ev-nobetcisi"
          git config user.email "actions@github.com"

          ARALIK=300            # 5 dakika
          SURE=19500            # 5 saat 25 dakika (6 saatlik is limitinin altinda)
          KAYIT_HER=6           # her 6 turda bir (~30 dk) durumu repoya yaz
          BITIS=$(( $(date +%s) + SURE ))
          TUR=0

          durumu_kaydet () {
            git add state/
            if git diff --staged --quiet; then
              return 0
            fi
            git commit -q -m "durum guncellendi [skip ci]"
            for deneme in 1 2 3; do
              if git push -q; then return 0; fi
              echo "push carpisti, yeniden deneniyor ($deneme)"
              git pull -q --rebase --autostash || true
            done
            echo "UYARI: durum gonderilemedi"
          }

          while [ "$(date +%s)" -lt "$BITIS" ]; do
            TUR=$(( TUR + 1 ))
            echo "--- tur $TUR ($(date -u +%H:%M:%S) UTC) ---"

            # Tek bir tur hata verirse dongu durmasin.
            python run.py || echo "UYARI: bu tur hata verdi, devam ediliyor"

            if [ $(( TUR % KAYIT_HER )) -eq 0 ]; then
              durumu_kaydet
            fi

            KALAN=$(( BITIS - $(date +%s) ))
            if [ "$KALAN" -le "$ARALIK" ]; then break; fi
            sleep "$ARALIK"
          done

          echo "--- dongu bitti, $TUR tur yapildi ---"
          durumu_kaydet

      - name: Yerine yenisini baslat
        # Is bittiginde ardilini kendi tetikler, boylece devir teslimde
        # bosluk olmaz. GITHUB_TOKEN ile workflow_dispatch calismiyor
        # (GitHub dongu olusmasin diye engelliyor), bu yuzden ayri bir
        # kisisel erisim anahtari gerekiyor: YENILEME_TOKEN.
        #
        # Anahtar tanimli degilse bu adim sessizce atlanir ve sistem
        # zamanlayiciya geri duser - o zaman devir teslimde yarim saate
        # varan bosluk olabilir.
        if: always() && steps.nobet.outputs.devam == 'evet'
        env:
          GH_TOKEN: ${{ secrets.YENILEME_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "YENILEME_TOKEN tanimli degil, ardil tetiklenmiyor."
            echo "Sistem zamanlayiciya guveniyor; devir teslimde bosluk olabilir."
            exit 0
          fi
          gh workflow run watch.yml --repo "$GITHUB_REPOSITORY"             && echo "ardil tetiklendi"             || echo "UYARI: ardil tetiklenemedi, zamanlayici devreye girecek"
